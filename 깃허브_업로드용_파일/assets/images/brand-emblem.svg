<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich 18K Solar Gold Gradient -->
    <linearGradient id="solarGold" x1="60" y1="60" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0C4"/>
      <stop offset="25%" stop-color="#E5C478"/>
      <stop offset="55%" stop-color="#C59B3F"/>
      <stop offset="85%" stop-color="#8E6A21"/>
      <stop offset="100%" stop-color="#E0BA68"/>
    </linearGradient>
    <!-- Pure Platinum / Starlight Gradient -->
    <linearGradient id="starlightPlat" x1="160" y1="160" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DFE4EA"/>
      <stop offset="100%" stop-color="#9BA1AA"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Restrained Slender Gold Ring (The Orbit) -->
  <circle cx="200" cy="200" r="172" stroke="url(#solarGold)" stroke-width="2.5" fill="none"/>
  <!-- Concentric Hairline Ring for Royal Seal Dignity -->
  <circle cx="200" cy="200" r="162" stroke="url(#solarGold)" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>

  <!-- Slender Inclined Orbital Ellipse (The Ecliptic Ring - Solid, Pure, Continuous) -->
  <ellipse cx="200" cy="200" rx="145" ry="52" transform="rotate(-28 200 200)" 
           stroke="url(#solarGold)" stroke-width="3" fill="none"/>

  <!-- Iconic Roman Letter C - Majestic Serifed Proportions -->
  <!-- Classical Roman Capital C embracing the center -->
  <path d="M 275 130 
           C 248 92, 195 90, 155 118 
           C 112 148, 108 245, 152 280 
           C 192 312, 252 308, 278 268" 
        stroke="url(#solarGold)" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Classical Serif Terminals for C -->
  <path d="M 270 125 L 285 138" stroke="url(#solarGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 272 272 L 288 260" stroke="url(#solarGold)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Faceted Stella Polaris 8-Pointed Star Solitaire -->
  <g transform="translate(200, 200)">
    <!-- Primary Cardinal Rays (North, South, East, West) -->
    <path d="M 0 -42 L 5 -12 L 42 0 L 5 12 L 0 42 L -5 12 L -42 0 L -5 -12 Z" 
          fill="url(#starlightPlat)" filter="url(#softGlow)"/>
    <!-- Diagonal Subtle Rays -->
    <path d="M 0 -24 L 3 -7 L 24 0 L 3 7 L 0 24 L -3 7 L -24 0 L -3 -7 Z" 
          transform="rotate(45)" fill="url(#solarGold)"/>
    <!-- Central Brilliant Diamond Facet -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFF2CE"/>
  </g>

  <!-- Four Cardinal Satellite Diamond Studs on Ring -->
  <circle cx="200" cy="28" r="4" fill="#FFFFFF"/>
  <circle cx="200" cy="372" r="4" fill="#FFFFFF"/>
  <circle cx="28" cy="200" r="4" fill="#FFFFFF"/>
  <circle cx="372" cy="200" r="4" fill="#FFFFFF"/>
</svg>
